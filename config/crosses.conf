# SuperMini nRF52840 clones have no external 32kHz crystal - use the
# internal RC oscillator or the firmware hangs at boot.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
# Declare the RC oscillator's real (sloppy) accuracy so the radio opens
# wide enough receive windows - drift here shows up as BLE lag over time.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# No OLEDs fitted on this build.
CONFIG_ZMK_DISPLAY=n

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

CONFIG_ZMK_BATTERY_REPORTING=y
